<svg fill="none" viewBox="0 0 850 60" width="850" height="60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: 800 22px 'JetBrains Mono', 'Courier New', monospace;
      fill: #00F0FF;
      letter-spacing: 2px;
      animation: pulse 3s infinite ease-in-out;
    }
    .sub {
      font: 600 13px 'JetBrains Mono', 'Courier New', monospace;
      fill: #8B949E;
      letter-spacing: 3px;
    }
