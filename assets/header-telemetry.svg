      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.6)); }
      50% { opacity: 0.75; filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.2)); }
    }
  </style>
  <text x="50%" y="28" dominant-baseline="middle" text-anchor="middle" class="title">
    SYS.ARCHITECT // SHREY VISHWAKARMA
  </text>
  <text x="50%" y="50" dominant-baseline="middle" text-anchor="middle" class="sub">
    SPATIAL COMPUTING • BLENDER PIPELINES • FULL-STACK • EMBEDDED AI
  </text>
</svg>
